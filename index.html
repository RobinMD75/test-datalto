<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Diagnostic DAB — Restitution</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background-color: #f4f6f9; }
    
    /* Écran de verrouillage */
    #login-box {
      max-width: 420px;
      margin: 120px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    #login-box h2 { margin-top: 0; color: #0044ff; }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0044ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #0033cc; }
    
    /* Conteneur Power BI */
    #content { display: none; width: 100%; height: 100vh; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Formulaire d'accès -->
  <div id="login-box">
    <h2>Diagnostic Flash DAB</h2>
    <p>Accès restreint — Veuillez saisir votre code d'accès :</p>
    <input type="password" id="passInput" placeholder="Mot de passe">
    <button onclick="validerCode()">Accéder au rapport</button>
  </div>

  <!-- Rapport Power BI -->
  <div id="content">
    <iframe 
      id="pbiFrame"
      src="https://app.powerbi.com/reportEmbed?reportId=80074225-c172-4846-bb34-f1e6be0c164c&autoAuth=true&ctid=07f2d2f9-b1c9-47e8-b00c-a5903cc61e74" 
      allowFullScreen="true">
    </iframe>
  </div>

  <script>
    function validerCode() {
      // Définissez ici le mot de passe d'accès
      var codeSecret = "CCI92-ISSY"; 
      var saisie = document.getElementById("passInput").value;
      
      if (saisie === codeSecret) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("content").style.display = "block";
      } else {
        alert("Mot de passe incorrect.");
      }
    }
    
    // Validation avec la touche Entrée
    document.getElementById("passInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") { validerCode(); }
    });
  </script>

</body>
</html>
